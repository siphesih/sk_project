services:
  database:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: local-root-password
      MARIADB_DATABASE: campustrack_db
      MARIADB_USER: campustrack
      MARIADB_PASSWORD: local-campustrack-password
    ports:
      - "3306:3306"
    volumes:
      - database-data:/var/lib/mysql
      - ./backend/campustrack_db.sql:/docker-entrypoint-initdb.d/01-campustrack.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      PORT: 5000
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: campustrack_db
      DB_USER: campustrack
      DB_PASSWORD: local-campustrack-password
      ML_SERVICE_URL: http://ml-service:6001
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "5000:5000"
    depends_on:
      database:
        condition: service_healthy
      ml-service:
        condition: service_started

  ml-service:
    build: ./campustrack_ml_model/ml_model
    ports:
      - "6001:6001"

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:5000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  database-data:
